name: Android Appium Tests

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --licenses <<<"y"
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "system-images;android-34;default;x86_64" "emulator"

      - name: Create and start emulator
        run: |
          echo "no" | avdmanager create avd -n ci-emulator -k "system-images;android-34;default;x86_64" --sdcard 512M
          nohup emulator -avd ci-emulator -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -netdelay none -netspeed full > /dev/null 2>&1 &
          adb wait-for-device
          adb shell getprop sys.boot_completed | tr -d '\r' | grep -m 1 "1"
          adb shell input keyevent 82

      - name: Install global tools
        run: |
          npm install -g appium@2.x
          appium driver install uiautomator2

      - name: Install project dependencies
        run: npm install

      - name: Download APK from F-Droid
        run: npm run fetch-apk

      - name: Start Appium server
        run: |
          nohup appium --allow-cors --log-level info:debug --log appium.log > /dev/null 2>&1 &
          sleep 5

      - name: Run WebdriverIO tests
        run: npm test

      - name: Generate Allure report
        run: npm run generate-report

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports
