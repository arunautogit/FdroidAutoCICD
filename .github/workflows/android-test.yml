name: Android Appium Tests

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install global tools
        run: |
          npm install -g appium@2.11.0
          appium driver install --source=npm appium-uiautomator2-driver@3.7.3

      - name: Install project dependencies
        run: npm install

      - name: Download APK from F-Droid
        run: npm run fetch-apk

      - name: Launch emulator and run tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: "-no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -netdelay none -netspeed full"
          script: |
            npm run fetch-apk
            nohup appium --allow-cors --log-level info:debug --log appium.log > /dev/null 2>&1 &
            sleep 5
            npm test

      - name: Generate Allure report
        run: npm run generate-report

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports
