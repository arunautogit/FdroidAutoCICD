name: Android Appium Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "30 0 * * *"   # Runs daily at 06:00 AM IST

permissions:
  contents: write

jobs:
  android:
    name: Run Android Appium Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NODE_VERSION: 20
      JAVA_VERSION: 17
      ANDROID_API: 33
      DEVICE_PROFILE: pixel_6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Appium and Android driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Install project dependencies
        run: npm install

      - name: Download F-Droid APK
        run: npm run fetch-apk

      - name: Start emulator and run tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API }}
          arch: x86_64
          target: google_apis
          profile: ${{ env.DEVICE_PROFILE }}
          disable-animations: true
          emulator-options: >
            -no-window
            -no-audio
            -no-boot-anim
            -gpu swiftshader_indirect
            -netdelay none
            -netspeed full
          script: |
            echo "Connected devices:"
            adb devices

            echo "Starting Appium..."
            nohup appium --log appium.log > /dev/null 2>&1 &

            sleep 10

            echo "Running tests..."
            npm test

      - name: Generate Allure report
        run: npm run generate-report

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Upload Allure report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports
          if-no-files-found: ignore

      - name: Deploy Allure report to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports/allure-report
          publish_branch: gh-pages