name: Android Appium Tests

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Enable hardware acceleration for emulator
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Install project dependencies
        run: npm install

      - name: Download APK from F-Droid
        run: npm run fetch-apk

      - name: Launch emulator and run tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -netdelay none -netspeed full
          disable-animations: true
          script: |
            adb devices
            nohup appium --log appium.log > /dev/null 2>&1 &
            sleep 10
            npm test

      - name: Generate Allure report
        run: npm run generate-report

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports
